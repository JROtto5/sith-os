# Sith Cyberpunk Terminal

# Font
font_family      Hack Nerd Font
bold_font        Hack Nerd Font Bold
italic_font      Hack Nerd Font Italic
bold_italic_font Hack Nerd Font Bold Italic
font_size 12.0

# Cursor
cursor_shape beam
cursor_beam_thickness 2.0
cursor_blink_interval 0.5
cursor #ff0050
cursor_text_color #080112

# Scrollback
scrollback_lines 10000

# Window
background_opacity 0.82
background_blur 64
window_padding_width 12
placement_strategy center
hide_window_decorations no
confirm_os_window_close 0

# Tab bar - powerline style
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_bar_min_tabs 1
tab_title_template " {index}: ⚡{title} "
active_tab_font_style bold
active_tab_foreground   #080112
active_tab_background   #00ffc8
inactive_tab_foreground #e6dcff
inactive_tab_background #28104a
tab_bar_background #0f031e

# Bell
enable_audio_bell no
visual_bell_duration 0.1
visual_bell_color #ff0050

# URLs
url_color #b400ff
url_style curly

# Selection
selection_foreground #080112
selection_background #00ff96

# Performance
repaint_delay 6
input_delay 1
sync_to_monitor yes

# ── Cyberpunk Color Scheme ──
foreground #e6dcff
background #080112

# Black
color0  #0f031e
color8  #281040

# Red
color1  #ff0033
color9  #ff3355

# Green
color2  #00ff96
color10 #32ffb4

# Yellow
color3  #ffaa00
color11 #ffc832

# Blue
color4  #b400ff
color12 #c832ff

# Magenta
color5  #9b59b6
color13 #b478d2

# Cyan
color6  #00ffc8
color14 #32ffdc

# White
color7  #e6dcff
color15 #ffffff

# Keyboard shortcuts
map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
map ctrl+shift+l next_tab
map ctrl+shift+h previous_tab
map ctrl+shift+equal change_font_size all +1.0
map ctrl+shift+minus change_font_size all -1.0
map ctrl+shift+0 change_font_size all 0
