# ══════════════════════════════════════════
# SITH OS — tmux configuration
# ══════════════════════════════════════════

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ag terminal-overrides ",*:Tc"

# Prefix key: Ctrl+Space (more ergonomic)
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Start windows/panes at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Mouse support
set -g mouse on

# Vi mode
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Split panes with | and -
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Navigate panes with Alt+arrow
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Resize panes with Ctrl+arrow
bind -n C-Left resize-pane -L 2
bind -n C-Right resize-pane -R 2
bind -n C-Up resize-pane -U 2
bind -n C-Down resize-pane -D 2

# Fast reload
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded"

# ── Theme ──────────────────────────────

# Status bar
set -g status-position bottom
set -g status-style "bg=#0f031e,fg=#e6dcff"
set -g status-left-length 40
set -g status-right-length 60

# Left: session name
set -g status-left "#[fg=#080112,bg=#b400ff,bold]  #S #[fg=#b400ff,bg=#0f031e,nobold]"

# Right: time and date
set -g status-right "#[fg=#1a0535]#[fg=#00ffc8,bg=#1a0535]  %H:%M #[fg=#b400ff,bg=#1a0535]#[fg=#080112,bg=#b400ff,bold] %d-%b "

# Window tabs
set -g window-status-format "#[fg=#5a00b4] #I:#W "
set -g window-status-current-format "#[fg=#0f031e,bg=#1a0535]#[fg=#00ffc8,bg=#1a0535,bold] #I:#W #[fg=#1a0535,bg=#0f031e]"
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#1a0535"
set -g pane-active-border-style "fg=#b400ff"

# Message style
set -g message-style "fg=#00ffc8,bg=#0f031e,bold"

# Clock
setw -g clock-mode-colour "#b400ff"
