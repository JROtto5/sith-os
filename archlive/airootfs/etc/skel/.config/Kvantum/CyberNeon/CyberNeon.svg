<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640">
  <defs>
    <linearGradient id="pointed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:#1a0535;stop-opacity:0.95"/>
      <stop offset="1" style="stop-color:#0f0320;stop-opacity:0.90"/>
    </linearGradient>
    <linearGradient id="pointed2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:#b400ff;stop-opacity:0.15"/>
      <stop offset="1" style="stop-color:#6e0096;stop-opacity:0.05"/>
    </linearGradient>
    <linearGradient id="highlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" style="stop-color:#b400ff;stop-opacity:0.8"/>
      <stop offset="1" style="stop-color:#8c00dc;stop-opacity:0.9"/>
    </linearGradient>
  </defs>
  <!-- WindowTranslucent -->
  <rect id="WindowTranslucent" x="0" y="0" width="100" height="100" rx="8" ry="8"
        style="fill:url(#pointed);opacity:0.88"/>
  <!-- GenericTranslucent -->
  <rect id="GenericTranslucent" x="110" y="0" width="100" height="100" rx="6" ry="6"
        style="fill:#0f0320;opacity:0.85"/>
  <!-- MenuTranslucent -->
  <rect id="MenuTranslucent" x="220" y="0" width="100" height="100" rx="8" ry="8"
        style="fill:#0f0320;opacity:0.82"/>
  <!-- TooltipTranslucent -->
  <rect id="TooltipTranslucent" x="330" y="0" width="100" height="100" rx="6" ry="6"
        style="fill:#190830;opacity:0.90"/>
  <!-- Button -->
  <rect id="Button" x="0" y="110" width="100" height="40" rx="6" ry="6"
        style="fill:url(#pointed2);stroke:#b400ff;stroke-width:1;opacity:0.9"/>
  <!-- ButtonFocused -->
  <rect id="ButtonFocused" x="110" y="110" width="100" height="40" rx="6" ry="6"
        style="fill:url(#pointed2);stroke:#b400ff;stroke-width:2;opacity:1"/>
  <!-- ButtonPressed -->
  <rect id="ButtonPressed" x="220" y="110" width="100" height="40" rx="6" ry="6"
        style="fill:url(#highlight);stroke:#d050ff;stroke-width:1;opacity:1"/>
  <!-- Progressbar -->
  <rect id="Progressbar" x="0" y="160" width="200" height="8" rx="4" ry="4"
        style="fill:url(#highlight);opacity:0.95"/>
  <!-- Scrollbar -->
  <rect id="Scrollbar" x="0" y="180" width="8" height="60" rx="4" ry="4"
        style="fill:#b400ff;opacity:0.5"/>
</svg>
