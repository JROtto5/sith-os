conky.config = {
    alignment = 'top_right',
    background = true,
    border_width = 0,
    cpu_avg_samples = 2,
    net_avg_samples = 2,
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = false,
    draw_outline = false,
    draw_shades = true,
    gap_x = 40,
    gap_y = 60,
    minimum_width = 320,
    maximum_width = 320,
    no_buffers = true,
    out_to_console = false,
    out_to_stderr = false,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    own_window_transparent = false,
    own_window_argb_visual = true,
    own_window_argb_value = 140,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    update_interval = 1.5,
    use_xft = true,
    font = 'Hack:size=9',
    xftalpha = 0.9,
    uppercase = false,
    override_utf8_locale = true,
    default_color = 'E6DCFF',
    color1 = 'B400FF',
    color2 = '00FFC8',
    color3 = 'FF0033',
    color4 = 'FFAA00',
    color5 = '8C64A0',
    default_shade_color = '0A0014',
    default_outline_color = 'B400FF',
};

conky.text = [[
${color1}${font Hack:Bold:size=14}SITH.SYSTEMS ${font Hack:size=9}${color5}${hr 2}
${color2}${font Hack:Bold:size=9}HOST ${color}${font}${nodename}
${color2}KERN ${color}${kernel}
${color2}UP   ${color}${uptime}

${color1}${font Hack:Bold:size=14}DARK.PROCESSOR ${font Hack:size=9}${color5}${hr 2}
${color2}${font Hack:Bold:size=9}LOAD ${color}${font}${cpu cpu0}% ${color1}${cpubar cpu0 8,200}
${color5}${cpugraph cpu0 40,320 B400FF 00FFC8 -t}
${color2}CORE 1 ${color}${cpu cpu1}% ${goto 170}${color2}CORE 2 ${color}${cpu cpu2}%
${color2}CORE 3 ${color}${cpu cpu3}% ${goto 170}${color2}CORE 4 ${color}${cpu cpu4}%
${color2}FREQ   ${color}${freq_g}GHz ${goto 170}${color2}TEMP  ${color}${acpitemp}C

${color1}${font Hack:Bold:size=14}FORCE.MEMORY ${font Hack:size=9}${color5}${hr 2}
${color2}${font Hack:Bold:size=9}RAM  ${color}${font}${mem} / ${memmax} ${color1}${membar 8,140}
${color2}SWAP ${color}${swap} / ${swapmax} ${color1}${swapbar 8,140}
${color5}${memgraph 40,320 B400FF 00FFC8 -t}

${color1}${font Hack:Bold:size=14}HOLOCRON.STORAGE ${font Hack:size=9}${color5}${hr 2}
${color2}${font Hack:Bold:size=9}ROOT ${color}${font}${fs_used /} / ${fs_size /} ${color1}${fs_bar 8,120 /}
${color2}HOME ${color}${fs_used /home} / ${fs_size /home} ${color1}${fs_bar 8,120 /home}
${color2}READ ${color}${diskio_read} ${goto 170}${color2}WRITE ${color}${diskio_write}
${color5}${diskiograph 40,320 B400FF 00FFC8 -t}

${color1}${font Hack:Bold:size=14}HOLONET ${font Hack:size=9}${color5}${hr 2}
${color2}${font Hack:Bold:size=9}UP   ${color}${font}${upspeed} ${goto 170}${color2}DOWN ${color}${downspeed}
${color5}${upspeedgraph 25,150 B400FF FF0050 -t} ${downspeedgraph 25,150 B400FF 00FFC8 -t}
${color2}LOCAL ${color}${addrs}
${if_existing /usr/bin/nvidia-smi}
${color1}${font Hack:Bold:size=14}KYBER.CRYSTAL ${font Hack:size=9}// GPU ${color5}${hr 2}
${color2}${font Hack:Bold:size=9}UTIL ${color}${font}${execi 3 nvidia-smi --query-gpu=utilization.gpu --format=csv,noheader,nounits 2>/dev/null || echo N/A}% ${goto 170}${color2}TEMP ${color}${execi 3 nvidia-smi --query-gpu=temperature.gpu --format=csv,noheader 2>/dev/null || echo N/A}C
${color2}VRAM ${color}${execi 3 nvidia-smi --query-gpu=memory.used --format=csv,noheader 2>/dev/null || echo N/A} / ${execi 3 nvidia-smi --query-gpu=memory.total --format=csv,noheader 2>/dev/null || echo N/A}
${color2}FAN  ${color}${execi 3 nvidia-smi --query-gpu=fan.speed --format=csv,noheader 2>/dev/null || echo N/A} ${goto 170}${color2}PWR ${color}${execi 3 nvidia-smi --query-gpu=power.draw --format=csv,noheader 2>/dev/null || echo N/A}
${endif}
${color1}${font Hack:Bold:size=14}SITH.INTEL ${font Hack:size=9}${color5}${hr 2}
${color2}${font Hack:Bold:size=9}NAME ${goto 180}CPU% ${goto 240}MEM%${font}
${color}${top name 1} ${goto 180}${top cpu 1} ${goto 240}${top mem 1}
${color5}${top name 2} ${goto 180}${top cpu 2} ${goto 240}${top mem 2}
${color5}${top name 3} ${goto 180}${top cpu 3} ${goto 240}${top mem 3}
${color5}${top name 4} ${goto 180}${top cpu 4} ${goto 240}${top mem 4}
${color5}${top name 5} ${goto 180}${top cpu 5} ${goto 240}${top mem 5}

${color1}${font Hack:Bold:size=14}DARK.PROPHECY ${font Hack:size=9}${color5}${hr 2}
${color3}${font Hack:Italic:size=9}"${execi 300 shuf -n1 ~/.config/conky/sith_quotes.txt}"${font}

${color1}${font Hack:Bold:size=14}THREAT.LEVEL ${font Hack:size=9}${color5}${hr 2}
${color2}${font Hack:Bold:size=9}LOAD ${color}${font}${loadavg 1} ${loadavg 2} ${loadavg 3}
${color2}STATUS ${color}${if_match ${loadavg 1} < 2}${color2}NOMINAL${else}${if_match ${loadavg 1} < 4}${color4}ELEVATED${else}${color3}CRITICAL${endif}${endif}
${color2}PROCS  ${color}${processes} ${goto 170}${color2}RUN ${color}${running_processes}
${color2}ENTROPY ${color}${entropy_avail} / ${entropy_poolsize}
]];
