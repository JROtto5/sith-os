---
dontChroot: false
script:
    - command: "plymouth-set-default-theme cyberpunk || true"
      timeout: 30
    - command: "grub-mkconfig -o /boot/grub/grub.cfg || true"
      timeout: 120
    # Add user to system groups (find the UID 1000 user created by Calamares)
    - command: "bash -c 'TARGET_USER=$(getent passwd 1000 | cut -d: -f1); if [ -n \"$TARGET_USER\" ]; then for g in wheel video audio storage network docker; do usermod -aG $g $TARGET_USER 2>/dev/null; done; fi || true'"
      timeout: 30
    # BTRFS Snapper auto-snapshot setup (fails harmlessly on non-BTRFS)
    - command: "snapper --no-dbus -c root create-config / || true"
      timeout: 30
    - command: "systemctl enable snapper-timeline.timer || true"
      timeout: 10
    - command: "systemctl enable snapper-cleanup.timer || true"
      timeout: 10
    - command: "systemctl enable grub-btrfsd || true"
      timeout: 10
    # GPU auto-detection
    - command: "bash -c 'if lspci | grep -qi nvidia; then systemctl enable nvidia-persistenced || true; fi'"
      timeout: 30
    - command: "bash -c 'if ! lspci | grep -qi nvidia; then pacman -Rns --noconfirm nvidia-open-dkms nvidia-utils nvidia-settings egl-wayland lib32-nvidia-utils || true; fi'"
      timeout: 60
    - command: "bash -c 'if ! lspci | grep -qi nvidia; then rm -f /etc/pacman.d/hooks/nvidia.hook /etc/modprobe.d/nvidia.conf; fi || true'"
      timeout: 10
    - command: "bash -c 'if lspci | grep -qi nvidia; then echo \"MODULES=(nvidia nvidia_modeset nvidia_uvm nvidia_drm)\" > /etc/mkinitcpio.conf.d/nvidia.conf && mkinitcpio -P; fi || true'"
      timeout: 300
    # NVIDIA Wayland environment variables (only on NVIDIA systems)
    - command: "bash -c 'if lspci | grep -qi nvidia; then printf \"\\nGBM_BACKEND=nvidia-drm\\n__GLX_VENDOR_LIBRARY_NAME=nvidia\\nLIBVA_DRIVER_NAME=nvidia\\n\" >> /etc/environment; fi'"
      timeout: 10
    # Remove NVIDIA kernel param from GRUB on non-NVIDIA systems
    - command: "bash -c 'if ! lspci | grep -qi nvidia; then sed -i \"s/ nvidia_drm.modeset=1//\" /etc/default/grub && grub-mkconfig -o /boot/grub/grub.cfg; fi || true'"
      timeout: 120
