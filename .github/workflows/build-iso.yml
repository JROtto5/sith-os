name: Build Sith OS ISO

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Arch environment
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm archiso git

      - name: Setup Chaotic-AUR
        run: |
          pacman-key --recv-key 3056513887B78AEB --keyserver keyserver.ubuntu.com
          pacman-key --lsign-key 3056513887B78AEB
          pacman -U --noconfirm 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-keyring.pkg.tar.zst'
          pacman -U --noconfirm 'https://cdn-mirror.chaotic.cx/chaotic-aur/chaotic-mirrorlist.pkg.tar.zst'

      - name: Build ISO
        run: |
          mkarchiso -v -w /tmp/work -o /tmp/out archlive/

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: sithos-iso
          path: /tmp/out/*.iso
          retention-days: 7

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: /tmp/out/*.iso
          body: |
            ## Sith OS ${{ github.ref_name }}

            The Dark Side of Linux

            ### Installation
            1. Download the ISO
            2. Flash to USB: `sudo dd if=sithos-*.iso of=/dev/sdX bs=4M status=progress`
            3. Boot from USB
            4. Click "Install Sith OS" or run `sithos-install`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
